name: Sync upstream

# Moves the workers-sdk submodule to the latest `main`, and updates the
# dependencies that don't follow it, in a pull request from the `upstream-sync`
# branch, then runs CI against it. Auto-merge rebases the pull request onto
# `main` once CI passes. Otherwise it stays open for fixes, which later runs keep
# (see UPSTREAM.md).

on:
  schedule:
    # Daily, at 06:17 UTC.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: the workers-sdk ref to move to
        default: origin/main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: upstream-sync

jobs:
  bump:
    name: Bump workers-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To approve CI's runs.
      actions: write
      contents: write
      pull-requests: write
    outputs:
      # Set even when a later step fails, so that the failure can be reported.
      pr: ${{ steps.update-pr.outputs.number || steps.pr.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          submodules: true
          # The full history, including the submodule's, for the commit message's
          # upstream log.
          fetch-depth: 0

      - name: Set up
        uses: ./.github/actions/setup
        with:
          setup-upstream: "false"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Keeps any fixes pushed to an open sync pull request, on top of `main`.
      - name: Check out the sync branch
        id: pr
        run: |
          number="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [[ -n "$number" ]]; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::The sync branch doesn't rebase cleanly onto main. Rebase it manually."
              exit 1
            fi
            git submodule update --init
          else
            git checkout -B "$BRANCH" origin/main
          fi

      - name: Bump workers-sdk
        id: bump
        run: |
          before="$(git rev-parse HEAD:workers-sdk)"
          # Commit and open the pull request even when the bump fails (e.g. a
          # patch no longer applies), so that it can be fixed there.
          status=0
          ./scripts/bump-upstream.sh "${{ inputs.ref || 'origin/main' }}" || status=$?
          after="$(git -C workers-sdk rev-parse HEAD)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "sha=$after" >> "$GITHUB_OUTPUT"
          # The workspace packages are the ones that `pnpm-workspace.yaml` lists.
          git add workers-sdk package.json pnpm-lock.yaml packages/*/package.json packages/e2e/fixtures/*/package.json pnpm-workspace.yaml .github/actions/setup/action.yml
          if ! git diff --cached --quiet; then
            {
              echo "Bump workers-sdk to ${after:0:9}"
              echo
              git -C workers-sdk log --oneline --no-decorate "$before..$after" | head -n 100
            } | git commit --file -
          fi

      # The dependencies that don't follow workers-sdk.
      - name: Update dependencies
        if: steps.bump.outputs.status == '0'
        run: |
          pnpm update:deps --report "$RUNNER_TEMP/dependencies.md"
          git add package.json pnpm-lock.yaml packages/*/package.json packages/e2e/fixtures/*/package.json
          if ! git diff --cached --quiet; then
            git commit --message "Update dependencies"
          fi

      - name: Push the sync branch
        id: push
        run: |
          if [[ -z "${{ steps.pr.outputs.number }}" && "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            echo "workers-sdk and the dependencies are up to date."
            exit 0
          fi
          git push --force-with-lease origin "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        id: update-pr
        if: steps.push.outputs.sha
        run: |
          sha="${{ steps.bump.outputs.sha }}"
          title="Sync with workers-sdk ${sha:0:9}"
          # There's no report when the dependencies weren't updated (e.g. the
          # bump failed). An assignment takes the exit status of its command
          # substitution, so a failing `cat` in it would end the step.
          dependencies="$(cat "$RUNNER_TEMP/dependencies.md" 2>/dev/null || true)"
          body="Moves the workers-sdk submodule to cloudflare/workers-sdk@$sha, and updates the dependencies that don't follow workers-sdk within their ranges.

          $dependencies

          The [sync workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/sync-upstream.yml) opened this, and auto-merge rebases it onto \`main\` once CI passes. If CI fails, push fixes to \`$BRANCH\`. Later syncs rebase the branch onto \`main\` and keep those fixes (see UPSTREAM.md)."
          number="${{ steps.pr.outputs.number }}"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
            number="$(gh pr view "$BRANCH" --json number --jq .number)"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The `pull_request` runs of pull requests that `GITHUB_TOKEN` creates or
      # updates wait for approval
      # (https://github.blog/changelog/2026-06-11-bot-created-pull-requests-can-run-workflows-if-approved/).
      # Approved, CI reports the checks that `main`'s ruleset requires, and
      # auto-merge rebases the pull request once they pass, including after
      # fixes are pushed to it.
      - name: Run CI and merge when it passes
        if: steps.update-pr.outputs.number && steps.bump.outputs.status == '0'
        run: |
          sha="$(git rev-parse HEAD)"
          ci_runs() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=pull_request" --jq '.workflow_runs[].id'
          }
          # The runs are created shortly after the push.
          for _ in $(seq 30); do
            [[ -n "$(ci_runs)" ]] && break
            sleep 10
          done
          if [[ -z "$(ci_runs)" ]]; then
            echo "::error::CI didn't start on the pull request."
            exit 1
          fi
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&status=action_required" --jq '.workflow_runs[].id'); do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve"
          done
          gh pr merge "${{ steps.update-pr.outputs.number }}" --auto --rebase

      - name: Fail if the bump failed
        if: steps.bump.outputs.status != '0'
        run: |
          echo "::error::scripts/bump-upstream.sh failed; see the 'Bump workers-sdk' step."
          exit 1

  report-failure:
    name: Report failure
    needs: bump
    if: failure() && needs.bump.outputs.pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Comment on the pull request
        run: |
          gh pr comment "${{ needs.bump.outputs.pr }}" --body "Syncing failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Push fixes to \`$BRANCH\`. The next sync rebases them onto \`main\`, runs CI, and merges the pull request once it passes."
