name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # We run `playwright install` manually instead
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  NODE_OPTIONS: "--max_old_space_size=8192"

jobs:
  check:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Check
        run: pnpm check

      - name: Unit tests
        run: pnpm test:ci

  playground:
    name: ${{ format('Vite plugin playgrounds ({0})', matrix.mode) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [serve, build]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Install playwright
        run: pnpm -F rsbuild-plugin-cloudflare-test-harness playwright:install

      - name: Build
        run: pnpm build

      - name: Run the playground suite against Rsbuild
        run: pnpm -F rsbuild-plugin-cloudflare-test-harness test:playground:${{ matrix.mode }}
        env:
          NODE_DEBUG: "@cloudflare:vite-plugin"

  e2e:
    name: Vite plugin e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # Without Cloudflare credentials, the remote-binding tests are skipped.
      - name: Run the e2e suite against Rsbuild
        run: pnpm -F rsbuild-plugin-cloudflare-test-harness test:e2e
        env:
          NODE_DEBUG: "vite-plugin:test"

  apps:
    name: ${{ format('E2E apps ({0})', matrix.mode) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, preview]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: true
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Install playwright
        run: pnpm -F rsbuild-plugin-cloudflare-e2e playwright:install

      - name: Build
        run: pnpm build

      - name: Run the e2e apps' tests
        run: pnpm -F rsbuild-plugin-cloudflare-e2e test:apps:${{ matrix.mode }}

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format('e2e-apps-{0}-results', matrix.mode) }}
          path: packages/e2e/test-results
          retention-days: 7

  tanstack-start:
    name: ${{ format('TanStack Start e2e ({0})', matrix.mode) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, preview]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # Nx's cache of TanStack's package builds, which only change with the pin.
      - name: Cache the TanStack/router build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tanstack-router/.nx/cache
          key: tanstack-router-nx-${{ runner.os }}-${{ hashFiles('packages/tanstack-start-e2e/upstream.json') }}

      - name: Prepare TanStack/router
        run: pnpm -F rsbuild-plugin-cloudflare-tanstack-start-e2e setup:tanstack-router

      - name: Install playwright
        run: pnpm -F rsbuild-plugin-cloudflare-tanstack-start-e2e playwright:install

      - name: Run TanStack Start's e2e tests
        run: pnpm -F rsbuild-plugin-cloudflare-tanstack-start-e2e test:${{ matrix.mode }}

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format('tanstack-start-{0}-results', matrix.mode) }}
          path: packages/tanstack-start-e2e/test-results
          retention-days: 7

  # Nobody is notified of the failed runs that `sync-upstream.yml` approves, so
  # they comment on the sync pull request.
  report-sync-failure:
    name: Report sync failure
    needs: [check, playground, e2e, apps, tanstack-start]
    if: failure() && github.event_name == 'pull_request' && github.head_ref == 'upstream-sync' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Comment on the pull request
        run: |
          gh pr comment "$GITHUB_HEAD_REF" --body "CI failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Push fixes to \`$GITHUB_HEAD_REF\`. Auto-merge rebases the pull request onto \`main\` once CI passes."
