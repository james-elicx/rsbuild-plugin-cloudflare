name: "Set up"
description: "Install Node.js and pnpm, prepare the workers-sdk submodule and install dependencies"
inputs:
  setup-upstream:
    description: when "false", skip preparing the workers-sdk submodule (e.g. because a script prepares it)
    default: "true"
  registry-url:
    description: the npm registry to authenticate with (e.g. to publish)
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # The Node.js version that workers-sdk's CI uses (`install-dependencies`).
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.23.1
        registry-url: ${{ inputs.registry-url }}
        cache: "pnpm"
        cache-dependency-path: |
          pnpm-lock.yaml
          workers-sdk/pnpm-lock.yaml

    - name: Get the workers-sdk commit
      id: upstream
      shell: bash
      run: echo "sha=$(git rev-parse HEAD:workers-sdk)" >> "$GITHUB_OUTPUT"

    # Building workers-sdk's packages (Miniflare, the Vite plugin...) is the
    # slowest part of the setup, so reuse Turbo's cache between runs.
    - name: Cache the workers-sdk build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: workers-sdk/.turbo/cache
        key: upstream-turbo-${{ runner.os }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('patches/**') }}
        restore-keys: |
          upstream-turbo-${{ runner.os }}-

    - name: Prepare the workers-sdk submodule
      if: inputs.setup-upstream == 'true'
      shell: bash
      run: ./scripts/setup-upstream.sh

    - name: Install dependencies
      if: inputs.setup-upstream == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
